<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Squid Squad</title>
<meta name="description" content="Squid Squad: a sunken-shipwreck video slot with sticky multiplier wilds, Squad Attack and four dives.">
<style>
  @font-face { font-family: 'Lilita One'; src: url('assets/fonts/lilita-one.ttf') format('truetype'); font-display: swap; }
  [hidden] { display: none !important; }
  #engineStatus { position: fixed; z-index: 40; top: 20px; left: 50%; transform: translateX(-50%); width: min(580px, 92vw); padding: 20px; border: 2px solid #ffd56b; border-radius: 18px; background: #061a2d; text-align: center; box-shadow: 0 8px 40px #000; }
  #engineMessage { margin: 0 0 14px; line-height: 1.5; }
  #sessionDetail { position: fixed; z-index: 6; top: 8px; right: 12px; color: #b8dbeb; font-size: 12px; text-align: right; }
  #btnDive { max-width: 110px; padding: 0 10px; font-size: 12px; }
  :root {
    --gold: #ffd56b; --gold-2: #f0a830; --gold-3: #8a5414;
    --navy: #061a2d; --navy-2: #0a2a45; --glass: rgba(5, 20, 36, .86);
    --text: #eaf7ff; --muted: #8fb4cc; --cyan: #5fe3ff; --pink: #ff5fd2; --red: #ff4d5e;
    --bar-h: 104px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #020b14; overflow: hidden; color: var(--text);
    font-family: 'Lilita One', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: .02em;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- bottom bar ---------- */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: grid; grid-template-columns: auto 1fr 1fr auto auto auto; grid-template-areas: "tools bal win bet mods spin";
    align-items: center; gap: 14px; padding: 12px max(22px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, rgba(2, 10, 20, 0) 0%, rgba(2, 10, 20, .78) 26%, rgba(2, 8, 16, .96) 100%); }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 22px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 213, 107, .55) 20%, rgba(255, 213, 107, .55) 80%, transparent); }
  .tools { grid-area: tools; display: flex; gap: 8px; }
  .mods { grid-area: mods; display: flex; gap: 10px; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 0; }
  .stat label { font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .stat output { font-size: 26px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 14px rgba(95, 227, 255, .25); white-space: nowrap; }
  #statBal { grid-area: bal; } #statWin { grid-area: win; }
  #statWin output { color: var(--gold); text-shadow: 0 2px 0 #3a1a00, 0 0 16px rgba(255, 200, 80, .35); }
  .betbox { grid-area: bet; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 40px;
    background: rgba(8, 30, 52, .8); border: 1px solid rgba(255, 213, 107, .35); }
  .betbox .stat { min-width: 86px; }
  .betbox .stat label { white-space: nowrap; }
  .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 50% 30%, #17466c, #0a253d 70%); border: 2px solid rgba(255, 213, 107, .55);
    box-shadow: 0 3px 0 #02101d, inset 0 1px 0 rgba(255, 255, 255, .18); transition: transform .12s, filter .12s, opacity .2s; }
  .ic svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ic:hover { filter: brightness(1.25); }
  .ic:active { transform: translateY(2px) scale(.96); }
  .ic.sm { width: 36px; height: 36px; font-size: 24px; line-height: 1; }
  .ic.on { background: radial-gradient(circle at 50% 30%, #ffe08a, #e79a22 70%); border-color: #fff3c4; }
  .ic.on svg { stroke: #3b1d00; }
  .ic.off::after { content: ""; position: absolute; width: 30px; height: 3px; background: var(--red); transform: rotate(-45deg); border-radius: 2px; box-shadow: 0 0 0 2px #0a253d; }
  .ic.pill { width: auto; padding: 0 16px; border-radius: 24px; font-size: 16px; letter-spacing: .08em; }
  .ic:disabled, .spin:disabled { opacity: .4; pointer-events: none; }
  .spin { grid-area: spin; width: 92px; height: 92px; border-radius: 50%; position: relative; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, #1e6aa0 0%, #0b3457 55%, #061d33 100%);
    border: 4px solid transparent; background-clip: padding-box;
    box-shadow: 0 0 0 4px #f6c453, 0 0 0 7px #7a4a12, 0 6px 0 7px #2a1504, 0 0 34px 6px rgba(255, 200, 80, .35), inset 0 3px 8px rgba(255, 255, 255, .25);
    transition: transform .12s, box-shadow .2s; }
  .spin:hover { box-shadow: 0 0 0 4px #ffe08a, 0 0 0 7px #7a4a12, 0 6px 0 7px #2a1504, 0 0 46px 10px rgba(255, 210, 100, .55), inset 0 3px 8px rgba(255, 255, 255, .3); }
  .spin:active { transform: translateY(3px) scale(.97); }
  .spin svg { width: 50px; height: 50px; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .5)); transition: transform .3s; }
  .spin.spinning svg { animation: rot .6s linear infinite; }
  .spin #autoCount { position: absolute; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 #000; }
  .spin.auto svg { opacity: .25; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- bonus buy ---------- */
  #btnBuy { position: fixed; z-index: 4; left: 0; top: 0; width: 200px; transform-origin: 50% 50%;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 10px 14px; border-radius: 22px;
    background: radial-gradient(120% 90% at 50% 0%, #7b1530 0%, #3a0718 55%, #1a030b 100%);
    border: 3px solid #ffcf63; box-shadow: 0 0 0 3px #6b3c0b, 0 8px 0 3px #1c0d02, 0 0 40px rgba(255, 70, 90, .45), inset 0 2px 0 rgba(255, 255, 255, .25);
    transition: filter .15s, opacity .3s, visibility .3s; animation: buyGlow 2.4s ease-in-out infinite; }
  #btnBuy:hover { filter: brightness(1.18); }
  #btnBuy img { width: 104px; height: 104px; margin-top: -6px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); animation: bob 3s ease-in-out infinite; }
  #btnBuy .t1 { font-size: 22px; line-height: 1; color: #fff; text-shadow: 0 2px 0 #3a0010; }
  #btnBuy .t2 { font-size: 15px; letter-spacing: .1em; color: #ffd0d8; }
  #btnBuy b { margin-top: 6px; font-weight: normal; font-size: 24px; color: var(--gold); padding: 2px 16px; border-radius: 14px;
    background: rgba(0, 0, 0, .45); border: 1px solid rgba(255, 213, 107, .5); text-shadow: 0 2px 0 #000; }
  #btnBuy.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #btnBuy:disabled { filter: grayscale(.6) brightness(.7); animation: none; }
  @keyframes buyGlow { 50% { box-shadow: 0 0 0 3px #6b3c0b, 0 8px 0 3px #1c0d02, 0 0 64px rgba(255, 70, 90, .75), inset 0 2px 0 rgba(255, 255, 255, .25); } }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }

  /* ---------- triple chance toggle (called "ante" in the code) ---------- */
  #btnAnte { position: fixed; z-index: 4; left: 0; top: 0; width: 200px; transform-origin: 50% 50%;
    display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 12px 10px 14px; border-radius: 22px;
    background: radial-gradient(120% 90% at 50% 0%, #22a058 0%, #0c5530 52%, #042512 100%);
    border: 3px solid #ffcf63; box-shadow: 0 0 0 3px #6b3c0b, 0 8px 0 3px #1c0d02, 0 0 28px rgba(60, 230, 140, .25), inset 0 2px 0 rgba(255, 255, 255, .25);
    transition: filter .15s, opacity .3s, visibility .3s, box-shadow .3s; }
  #btnAnte:hover { filter: brightness(1.15); }
  #btnAnte .k { font-size: 13px; letter-spacing: .26em; color: #b8ffd4; text-shadow: 0 2px 0 #052812; }
  #btnAnte .p { font-size: 30px; line-height: 1; color: #fff; text-shadow: 0 3px 0 #052812, 0 0 14px rgba(0, 0, 0, .35); }
  #btnAnte .p b { font-weight: normal; color: var(--gold); }
  #btnAnte .pr { position: relative; display: flex; align-items: center; height: 44px; margin: 1px 0; }
  #btnAnte .pr img { width: 40px; height: 40px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
  #btnAnte .pr img + img { margin-left: -14px; }
  #btnAnte .pr em { margin-left: 2px; font-style: normal; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 #3a1a00; }
  #btnAnte .t2 { font-size: 15px; line-height: 1.05; color: #eafff2; text-align: center; text-shadow: 0 2px 0 #052812; }
  #btnAnte .sw { position: relative; margin-top: 9px; width: 124px; height: 40px; border-radius: 22px; background: rgba(0, 0, 0, .5);
    border: 2px solid rgba(255, 213, 107, .6); box-shadow: inset 0 3px 7px rgba(0, 0, 0, .65); }
  #btnAnte .sw i { position: absolute; left: 3px; top: 3px; width: 56px; height: 30px; border-radius: 17px; display: grid; place-items: center;
    background: linear-gradient(180deg, #9af5bd, #22a35a); box-shadow: 0 2px 0 #0b4a2a, inset 0 1px 0 rgba(255, 255, 255, .7);
    transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), background .3s; }
  #btnAnte .sw svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .4)); }
  #btnAnte .sw em { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 19px; color: #fff; }
  #btnAnte.on { box-shadow: 0 0 0 3px #6b3c0b, 0 8px 0 3px #1c0d02, 0 0 44px rgba(90, 255, 160, .6), inset 0 2px 0 rgba(255, 255, 255, .3); animation: anteGlow 2s ease-in-out infinite; }
  #btnAnte.on .sw i { transform: translateX(62px); background: linear-gradient(180deg, #fff0a8, #f0a830); }
  #btnAnte.on .sw svg { stroke: #5a2c00; filter: none; }
  #btnAnte.on .sw em { right: auto; left: 16px; color: var(--gold); }
  #btnAnte.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #btnAnte:disabled { filter: grayscale(.4) brightness(.75); animation: none; }
  @keyframes anteGlow { 50% { box-shadow: 0 0 0 3px #6b3c0b, 0 8px 0 3px #1c0d02, 0 0 64px rgba(90, 255, 160, .85), inset 0 2px 0 rgba(255, 255, 255, .3); } }
  #btnBuy.locked { filter: grayscale(.85) brightness(.55); animation: none; }
  #btnBuy.locked img { animation: none; }

  /* ---------- modals ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: rgba(1, 6, 14, .62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .2s; }
  .modal[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  .panel { position: relative; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 26px 26px 24px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(14, 50, 80, .97), rgba(5, 20, 36, .98)); border: 3px solid #e7b453;
    box-shadow: 0 0 0 3px #5b3409, 0 24px 60px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .2); text-align: center; animation: pop .28s cubic-bezier(.2, 1.6, .4, 1); }
  .panel.red { background: linear-gradient(180deg, rgba(92, 12, 30, .97), rgba(30, 4, 12, .98)); }
  .panel.wide { width: min(860px, 100%); text-align: left; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .panel h2 { margin: 0 0 8px; font-weight: normal; font-size: 30px; color: var(--gold); text-shadow: 0 3px 0 #2a1200; text-align: center; }
  .panel h3 { margin: 22px 0 8px; font-weight: normal; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 #2a1200; }
  .panel p { margin: 8px 0; font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #d6e9f5; letter-spacing: 0; }
  .panel p b { font-family: 'Lilita One', sans-serif; font-weight: normal; color: #fff; letter-spacing: .03em; }
  .ptitle { width: 78%; max-width: 360px; display: block; margin: -4px auto 4px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
  .x { position: absolute; right: 12px; top: 10px; width: 40px; height: 40px; border-radius: 50%; font-size: 26px; color: #fff; background: rgba(0, 0, 0, .3); }
  .x:hover { background: rgba(255, 255, 255, .12); }
  .row { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .btn { min-width: 130px; padding: 13px 24px; border-radius: 30px; font-size: 22px; letter-spacing: .05em;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .35); transition: transform .1s, filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(3px); }
  .btn.gold { background: linear-gradient(180deg, #ffe592, #f2a834 60%, #c87414); color: #3b1a00; text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
  .btn.ghost { background: rgba(255, 255, 255, .08); border: 2px solid rgba(255, 255, 255, .25); }
  .btn.big { font-size: 30px; padding: 16px 46px; }
  .price { margin-top: 14px; font-size: 18px; color: #ffd0d8; letter-spacing: .1em; }
  .price b { display: block; font-weight: normal; font-size: 46px; color: var(--gold); letter-spacing: .02em; text-shadow: 0 3px 0 #2a0008, 0 0 24px rgba(255, 200, 80, .4); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 10px; margin-top: 14px; }
  .chips .btn { min-width: 0; padding: 14px 0; }
  .pays { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .pay { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(0, 0, 0, .25); border: 1px solid rgba(255, 213, 107, .2); }
  .pay img { width: 64px; height: 64px; flex: none; }
  .pay ul { list-style: none; margin: 0; padding: 0; font-size: 16px; line-height: 1.35; }
  .pay li span { color: var(--gold); display: inline-block; width: 22px; }
  .feat { display: flex; gap: 14px; align-items: flex-start; }
  .feat img { width: 84px; height: 84px; flex: none; }
  .fine { font-size: 13px !important; color: var(--muted) !important; }
  .rtpTable { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; }
  .rtpTable th, .rtpTable td { padding: 8px 5px; border-bottom: 1px solid rgba(255, 213, 107, .2); text-align: right; }
  .rtpTable th:first-child, .rtpTable td:first-child { text-align: left; }
  .rtpTable small { display: block; font-size: 11px; color: var(--muted); }
  .kbd { display: inline-block; padding: 1px 8px; border-radius: 6px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); font-family: 'Lilita One'; }

  /* ---------- bonus buy: choose your depth ---------- */
  .modal.dive { padding: 12px; background: rgba(1, 4, 10, .72); }
  .divePanel { position: relative; isolation: isolate; width: min(960px, 100%); height: min(790px, calc(100vh - 24px)); height: min(790px, calc(100dvh - 24px));
    display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; border: 3px solid #e7b453;
    background: linear-gradient(180deg, #2399bb 0%, #0f6189 16%, #0b3563 38%, #14114a 60%, #1c0a26 80%, #2e0509 100%);
    box-shadow: 0 0 0 3px #5b3409, 0 0 0 10px rgba(24, 12, 2, .6), 0 30px 90px rgba(0, 0, 0, .75), inset 0 0 70px rgba(0, 0, 0, .55);
    animation: pop .34s cubic-bezier(.2, 1.5, .4, 1); }
  /* rivets along the brass frame */
  .divePanel::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit;
    background: radial-gradient(circle, #fff1bf 0 1.4px, #d39a3a 2px 2.8px, #4a2a06 3.3px, transparent 3.9px) 14px 4px / 44px 10px repeat-x,
      radial-gradient(circle, #fff1bf 0 1.4px, #d39a3a 2px 2.8px, #4a2a06 3.3px, transparent 3.9px) 14px calc(100% - 4px) / 44px 10px repeat-x; }
  .diveWater { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .diveWater .rays { position: absolute; left: -15%; right: -15%; top: -4%; height: 62%; mix-blend-mode: screen;
    background: repeating-conic-gradient(from 150deg at 50% -18%, rgba(190, 245, 255, 0) 0deg, rgba(190, 245, 255, .16) 2.5deg, rgba(190, 245, 255, 0) 6deg, rgba(190, 245, 255, 0) 11deg);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
    animation: diveRays 10s ease-in-out infinite alternate; }
  @keyframes diveRays { to { transform: translateX(4%) rotate(2deg); opacity: .65; } }
  .diveWater .snow { position: absolute; left: 0; right: 0; top: -260px; bottom: 0; opacity: .55; animation: diveSnow 16s linear infinite;
    background-image: radial-gradient(1.6px 1.6px at 12% 18%, rgba(255, 255, 255, .7), transparent), radial-gradient(1.2px 1.2px at 37% 64%, rgba(255, 255, 255, .55), transparent),
      radial-gradient(1px 1px at 58% 30%, rgba(255, 255, 255, .6), transparent), radial-gradient(2px 2px at 81% 77%, rgba(200, 240, 255, .45), transparent),
      radial-gradient(1.3px 1.3px at 92% 12%, rgba(255, 255, 255, .5), transparent), radial-gradient(1px 1px at 24% 88%, rgba(255, 255, 255, .5), transparent);
    background-size: 260px 260px; }
  @keyframes diveSnow { to { transform: translateY(260px); } }
  .diveWater .jl { position: absolute; width: 64px; right: 5%; top: 30%; opacity: .3; filter: blur(.6px); animation: diveDrift 9s ease-in-out infinite; }
  .diveWater .jl.b { width: 40px; right: auto; left: 2.5%; top: 52%; opacity: .2; animation-duration: 12s; animation-delay: -5s; }
  .diveWater .sq { position: absolute; width: 72%; right: -22%; bottom: 2%; opacity: .32; filter: brightness(.22) sepia(1) saturate(4) hue-rotate(-38deg) blur(1.5px); animation: diveLurk 18s ease-in-out infinite; }
  @keyframes diveDrift { 50% { transform: translateY(-28px) scaleY(.93); } }
  @keyframes diveLurk { 50% { transform: translate(-5%, -4%) rotate(-3deg); } }

  .dive .x { z-index: 5; }
  .diveHead { position: relative; flex: none; padding: 22px 76px 4px; text-align: center; }
  .diveKicker { font-size: 14px; letter-spacing: .34em; color: #c4f4ff; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
  .diveHead h2 { margin: 2px 0 6px; font-weight: normal; font-size: 50px; line-height: 1; letter-spacing: .02em; color: transparent;
    background: linear-gradient(180deg, #fffbe0 0%, #ffe28a 36%, #f4ac34 62%, #c7731a 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 3px 0 #3a1a00) drop-shadow(2px 0 0 #3a1a00) drop-shadow(-2px 0 0 #3a1a00) drop-shadow(0 -2px 0 #3a1a00) drop-shadow(0 10px 14px rgba(0, 0, 0, .45)); }
  .buySub { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.4; color: #d7f1ff; letter-spacing: 0; }
  .buySub b { font-family: 'Lilita One', sans-serif; font-weight: normal; color: var(--gold); letter-spacing: .03em; }

  .diveBody { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 26px 8px 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .stations { position: relative; flex: 1; display: flex; flex-direction: column; gap: 10px; --shaft: 174px; --line: 126px; }
  /* the depth ruler the bell rides down */
  .stations::before { content: ""; position: absolute; left: calc(var(--line) - 8px); top: -14px; bottom: -6px; width: 16px; pointer-events: none;
    background: linear-gradient(90deg, transparent 7px, rgba(255, 213, 107, .5) 7px 9px, transparent 9px),
      repeating-linear-gradient(180deg, rgba(255, 213, 107, .45) 0 2px, transparent 2px 13px) center / 8px 100% no-repeat,
      repeating-linear-gradient(180deg, rgba(255, 213, 107, .75) 0 2px, transparent 2px 65px) center / 16px 100% no-repeat; }
  /* the bell and its cable live in a clipped layer so the bouncy drop never makes the list scroll */
  .stations .shaftLayer { position: absolute; left: 0; right: 0; top: -14px; bottom: -6px; z-index: 3; overflow: hidden; pointer-events: none; }
  .stations .cable { position: absolute; left: calc(var(--line) - 3px); top: 0; width: 6px; height: 0; z-index: 2; pointer-events: none; border-radius: 2px;
    background: linear-gradient(90deg, rgba(0, 0, 0, .35), rgba(255, 255, 255, .25) 40%, rgba(0, 0, 0, .45)), repeating-linear-gradient(180deg, #b7a27a 0 7px, #3b2f20 7px 9px); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4), 0 0 10px rgba(255, 200, 100, .2);
    transition: height .8s cubic-bezier(.3, 1.3, .5, 1); }
  .stations .bell { position: absolute; left: calc(var(--line) - 48px); top: 0; width: 96px; pointer-events: none;
    transition: transform .8s cubic-bezier(.3, 1.3, .5, 1); }
  .stations .bell img { display: block; width: 100%; transform-origin: 50% 0; animation: diveSway 3.4s ease-in-out infinite;

<body>
<canvas id="game" aria-label="Squid Squad slot reels"></canvas>
<div id="sessionDetail" aria-live="polite"></div>
<div id="engineStatus" role="alert" hidden><p id="engineMessage"></p><button id="btnRecover" class="btn gold">Reconnect</button></div>

<button id="btnBuy" class="hide" aria-label="Buy free spins">

  <span class="t2">ENHANCED CHANCE<br>TO WIN A BONUS</span>
  <span class="sw" aria-hidden="true"><i><svg viewBox="0 0 24 24"><path d="M5 12h13M12 6l6 6-6 6"/></svg></i><em id="anteState">OFF</em></span>
</button>

<div id="bar">
  <div class="tools">
    <button id="btnInfo" class="ic" aria-label="Paytable and rules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.1"/></svg></button>
    <button id="btnMusic" class="ic" aria-label="Toggle music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button id="btnSound" class="ic" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  </div>
  <div class="stat" id="statBal"><label>Balance</label><output id="balance">$0.00</output></div>
  <div class="stat" id="statWin"><label>Win</label><output id="lastWin">$0.00</output></div>
  <div class="betbox">
    <button id="betDown" class="ic sm" aria-label="Lower bet">−</button>
    <div class="stat"><label id="betLabel">Bet</label><output id="bet">$1.00</output></div>
    <button id="betUp" class="ic sm" aria-label="Raise bet">+</button>
  </div>
  <div class="mods">
    <button id="btnDive" class="ic pill" aria-label="Choose your dive before spinning">KRAKEN</button>
    <button id="btnTurbo" class="ic" aria-label="Turbo spin"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button id="btnAuto" class="ic pill" aria-label="Autoplay">AUTO</button>
  </div>
  <button id="btnSpin" class="spin" aria-label="Spin"><svg viewBox="0 0 48 48"><path d="M38 17a15 15 0 0 0-27-2"/><path d="M10 7v8h8"/><path d="M10 31a15 15 0 0 0 27 2"/><path d="M38 41v-8h-8"/></svg><span id="autoCount"></span></button>
</div>

<div class="modal dive" id="mBuy" hidden>
  <div class="divePanel" role="dialog" aria-modal="true" aria-labelledby="buyTitle">

      <i class="rays"></i><i class="snow"></i>
      <img class="jl" src="assets/f_jelly.webp" alt=""><img class="jl b" src="assets/f_jelly.webp" alt="">
      <img class="sq" src="assets/f_bigsquid.webp" alt="">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gaugeG" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5fe3a0"/><stop offset=".45" stop-color="#ffd56b"/><stop offset=".75" stop-color="#ff8a3a"/><stop offset="1" stop-color="#ff3b4e"/></linearGradient></defs></svg>
    <button class="x" data-close aria-label="Close">×</button>

</div>

    <button class="x" data-close aria-label="Close">×</button>
